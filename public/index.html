<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>ArrowFlow</title>

  <!-- PWA / Install -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b3d91">

  <!-- iPhone support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ArrowFlow">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>

<body>
  <h2>Dealer Wash System</h2>
  <p id="status">Loading...</p>

  <script type="module">
    import { auth, db } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const statusEl = document.getElementById("status");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "/login.html";
        return;
      }

      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        const roleRaw = snap.exists() ? (snap.data().role || "pending") : "pending";
        const role = String(roleRaw).trim().toLowerCase();
        const active = snap.exists() ? (snap.data().active !== false) : true;

        if (!active) {
          window.location.href = "/login.html";
          return;
        }

        if (role === "pending") {
          window.location.href = "/pending.html";
          return;
        }

        window.location.href = "/home.html";
      } catch (e) {
        console.error(e);
        statusEl.textContent = "Error loading profile. Check console.";
      }
    });
  </script>
</body>

</html>
