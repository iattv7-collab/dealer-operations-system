<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wash</title>

  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      margin: 16px;
    }

    input,
    textarea,
    button,
    select {
      font-family: inherit;
      font-size: 16px;
    }

    .card {
      border: 1px solid #ccc;
      padding: 12px;
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      vertical-align: top;
    }

    th {
      text-align: left;
    }

    .muted {
      color: #666;
    }

    .ok {
      color: #0a6;
    }

    .err {
      color: #b00;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .table-scroll {
      overflow-x: auto;
    }

    .table-scroll table {
      width: max-content;
      min-width: 100%;
    }

    .section {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .pill {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #aaa;
      background: #eee;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="nav"></div>

  <p id="status"></p>

  <!-- ✅ GLOBAL WASH DAY CONTROL -->
  <div id="manualControls" class="section">
    <div style="font-weight:bold;margin-bottom:8px;">
      Wash Day Control
    </div>

    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <button id="openWashBtn">Open Wash Day</button>
      <button id="closeWashBtn">Close Wash Day</button>

      Current:
      <span id="isOpenBadge" class="pill"></span>
    </div>
  </div>

  <h2>Wash Team</h2>

  <div class="muted">
    Work queue: <b>queued</b> and <b>washing</b>. (You can mark <b>washed</b>.)
  </div>

  <div style="height:12px"></div>

  <div class="card">
    <div id="msg" class="muted"></div>
    <div style="height:10px"></div>

    <div class="table-scroll">
      <table id="ticketsTable"></table>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";

    import { onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import { requireRole, getUserProfile }
      from "./js/guard.js";

    import { renderNav }
      from "./js/nav.js";

    import { mountTicketsUI }
      from "./js/ticketsUI.js";

    import { listenSystemSettings, setSystemSettings }
      from "./js/settings.js";

    document.getElementById("nav").innerHTML = `
  <div style="display:flex; gap:10px; margin-bottom:12px;">
    <a href="/home.html" style="text-decoration:none; padding:6px 10px; border:1px solid #ccc; border-radius:6px; color:#000;">Home</a>
  </div>
` + renderNav("ROLE");

    // allow wash + manager + admin
    requireRole(["wash", "manager", "admin"]);

    const msgEl = document.getElementById("msg");
    const tableEl = document.getElementById("ticketsTable");

    const openBtn = document.getElementById("openWashBtn");
    const closeBtn = document.getElementById("closeWashBtn");
    const badge = document.getElementById("isOpenBadge");

    // badge always updates
    listenSystemSettings((s) => {
      badge.textContent = s?.isOpen ? "OPEN" : "CLOSED";
    });

    // auth status msg
    onAuthStateChanged(auth, (u) => {
      if (!u) {
        msgEl.className = "err";
        msgEl.textContent = "Not signed in.";
      } else {
        msgEl.className = "muted";
        msgEl.textContent = "";
      }
    });

    // enable/disable open/close buttons by permission
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      const profile = await getUserProfile(user);

      const canControl =
        profile?.permissions?.canControlWashDay === true ||
        profile?.role === "admin" ||
        profile?.role === "manager";

      openBtn.disabled = !canControl;
      closeBtn.disabled = !canControl;
    });

    openBtn.onclick = async () => {
      await setSystemSettings(auth.currentUser, { isOpen: true });
    };

    closeBtn.onclick = async () => {
      await setSystemSettings(auth.currentUser, { isOpen: false });
    };

    // ✅ mount UI AFTER we load profile, so we can pass perms + view columns
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      const profile = await getUserProfile(user);

      const canEditTickets = profile?.permissions?.canEditTickets === true;
      const correctionsPerms = profile?.permissions?.corrections || {};

      // optional: respect per-role viewColumns if present
      const viewColumnKeys = profile?.viewColumns?.wash || [];

      mountTicketsUI({
        role: "wash",
        tableEl,
        msgEl,
        showTabs: true,
        viewColumnKeys,
        canEditTickets,
        correctionsPerms
      });
    });
  </script>

</body>

</html>
