<!-- FILE: /public/wash.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wash</title>

  <link rel="stylesheet" href="/css/arrowflow.css">
</head>

<body>

  <div id="nav"></div>

  <p id="status"></p>

  <div id="manualControls" class="section">
    <div style="font-weight:bold;margin-bottom:8px;">
      Wash Day Control
    </div>

    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <button id="openWashBtn">Open Wash Day</button>
      <button id="closeWashBtn">Close Wash Day</button>

      Current:
      <span id="isOpenBadge" class="pill"></span>
    </div>
  </div>

  <h2>Wash Team</h2>

  <div class="muted">
    Work queue: <b>queued</b> and <b>washing</b>. (You can mark <b>washed</b>.)
  </div>

  <div style="height:12px"></div>

  <div class="card">
    <div id="msg" class="muted"></div>
    <div style="height:10px"></div>

    <div class="table-scroll">
      <table id="ticketsTable"></table>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";

    import { onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import { requireRole, getUserProfile }
      from "./js/guard.js";

    import { renderNav }
      from "./js/nav.js";

    import { mountTicketsUI }
      from "./js/ticketsUI.js";

    import { listenSystemSettings, setSystemSettings }
      from "./js/settings.js";

    document.getElementById("nav").innerHTML = renderNav("ROLE");

    requireRole(["wash", "manager", "admin"]);

    const msgEl = document.getElementById("msg");
    const tableEl = document.getElementById("ticketsTable");

    const openBtn = document.getElementById("openWashBtn");
    const closeBtn = document.getElementById("closeWashBtn");
    const badge = document.getElementById("isOpenBadge");

    const statusEl = document.getElementById("status");

    listenSystemSettings((s) => {
      badge.textContent = s?.isOpen ? "OPEN" : "CLOSED";
    });

    onAuthStateChanged(auth, (u) => {
      if (!u) {
        msgEl.className = "err";
        msgEl.textContent = "Not signed in.";
      } else {
        msgEl.className = "muted";
        msgEl.textContent = "";
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      const profile = await getUserProfile(user);
      const role = profile?.role || "wash";

      statusEl.textContent = `${user.email} · ${role}`;

      const canControl =
        profile?.permissions?.canControlWashDay === true ||
        role === "admin" ||
        role === "manager";

      openBtn.disabled = !canControl;
      closeBtn.disabled = !canControl;

      const canEditTickets = profile?.permissions?.canEditTickets === true;
      const correctionsPerms = profile?.permissions?.corrections || {};
      const viewColumnKeys = profile?.viewColumns?.wash || [];

      mountTicketsUI({
        role: "wash",
        tableEl,
        msgEl,
        showTabs: true,
        viewColumnKeys,
        canEditTickets,
        correctionsPerms
      });

      // ✅ highlight active tab
      const path = window.location.pathname.split("/").pop();

      document.querySelectorAll("#nav a").forEach(link => {
        const href = link.getAttribute("href");
        if (href && path === href.split("/").pop()) {
          link.classList.add("active");
        }
      });
    });

    openBtn.onclick = async () => {
      await setSystemSettings(auth.currentUser, { isOpen: true });
    };

    closeBtn.onclick = async () => {
      await setSystemSettings(auth.currentUser, { isOpen: false });
    };

  </script>

</body>

</html>
