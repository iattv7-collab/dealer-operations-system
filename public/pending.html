<!-- FILE: /public/pending.html -->

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pending Approval</title>
  <link rel="stylesheet" href="/css/arrowflow.css">
</head>
<body>

  <div class="page" style="max-width: 620px; margin: 40px auto;">
    <div class="card">
      <h2 style="margin-top:0;">Waiting for approval</h2>
      <p>Your account is pending. Please contact your manager/admin.</p>
      <p id="status" class="muted"></p>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
        <button id="btnBackLogin" type="button">Back to Login</button>
        <button id="btnBackArrowDev" type="button">ArrowDev Login</button>
        <button id="btnSignOut" type="button">Sign out</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const statusEl = document.getElementById("status");

    document.getElementById("btnBackLogin").addEventListener("click", () => {
      window.location.href = "/login.html";
    });

    document.getElementById("btnBackArrowDev").addEventListener("click", () => {
      window.location.href = "/arrowdev-login.html";
    });

    document.getElementById("btnSignOut").addEventListener("click", async () => {
      try {
        statusEl.textContent = "Signing out...";
        await signOut(auth);
        window.location.href = "/login.html";
      } catch (e) {
        statusEl.textContent = e.message || "Sign out failed.";
      }
    });
  </script>

</body>
</html>
