<!DOCTYPE html>Advisor Role
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      margin: 16px;
    }

    button {
      font-family: inherit;
      font-size: 16px;
    }

    .card {
      border: 1px solid #ccc;
      padding: 12px;
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      vertical-align: top;
    }

    th {
      text-align: left;
    }

    .muted {
      color: #666;
    }

    .ok {
      color: #0a6;
    }

    .err {
      color: #b00;
    }

    .advisor-grid {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .left-col {
      flex: 1 1 auto;
      min-width: 0;
      /* CHANGED: allows flex child to shrink + enables horizontal scroll */
    }

    .right-col {
      flex: 0 0 260px;
    }

    /* horizontal scroll container */
    .table-scroll {
      overflow-x: auto;
    }

    /* allow table to grow wider than container */
    .table-scroll table {
      width: max-content;
      min-width: 100%;
    }
  </style>
</head>

<body>
  <div id="nav"></div>
  <p id="status"></p>

  <h2>Advisor</h2>

  <div class="card">
    <div class="advisor-grid">
      <!-- LEFT -->
      <div class="left-col">
        <div class="muted">
          Universal tabs + columns. Advisor actions are enabled by role.
        </div>

        <div id="msg" class="muted" style="margin-top:10px;"></div>

        <!-- ADDED: live search -->
        <div style="margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label for="searchInput" class="muted">Search:</label>
          <input id="searchInput" type="text" placeholder="Tag or RO..." style="padding:6px 8px; width:240px;" />
        </div>

        <div class="table-scroll" style="margin-top:10px;">
          <table id="ticketsTable"></table>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import { requireRole, getUserProfile } from "./js/guard.js";
    import { renderNav } from "./js/nav.js";
    import { mountTicketsUI } from "./js/ticketsUI.js";
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    document.getElementById("nav").innerHTML = renderNav("advisor");
    requireRole(["advisor", "manager", "admin", "booker", "qc"]);

    // IMPORTANT: mount UI using the REAL role from Firestore (not hardcoded "advisor")
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      const profile = await getUserProfile(user);
      const realRole = String(profile?.role || "staff").toLowerCase();

      const viewColumnKeys = Array.isArray(profile?.viewColumns?.[realRole])
        ? profile.viewColumns[realRole]
        : [];

      mountTicketsUI({
        role: realRole,
        tableEl: document.getElementById("ticketsTable"),
        msgEl: document.getElementById("msg"),
        showTabs: true,
        searchEl: document.getElementById("searchInput"),
        viewColumnKeys: profile?.viewColumns?.[realRole] || []
      });
    });
  </script>

</body>

</html>
