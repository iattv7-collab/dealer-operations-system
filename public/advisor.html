<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor</title>

  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      margin: 16px;
      max-width: 100%;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      font-size: 16px;
    }

    .card {
      border: 1px solid #ccc;
      padding: 12px;
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      text-align: left;
    }

    .muted {
      color: #666;
    }

    .ok {
      color: #0a6;
    }

    .err {
      color: #b00;
    }

    .advisor-grid {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .left-col {
      flex: 1 1 auto;
      min-width: 0;
    }

    .right-col {
      flex: 0 0 260px;
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .table-scroll table {
      width: max-content;
      min-width: 100%;
    }

    #nav>div {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    #nav a {
      text-decoration: none;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      color: #000;
      display: inline-block;
    }

    #searchInput {
      padding: 8px 10px !important;
      width: 240px !important;
      max-width: 100%;
      box-sizing: border-box;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {

  body {
    margin: 10px;
  }

  #nav>div {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  #nav a {
    flex: 0 1 auto;
    text-align: center;
    padding: 8px 10px;
    font-size: 14px;
    box-sizing: border-box;
  }

  .card {
    padding: 12px 10px;
    border-radius: 10px;
  }

  .advisor-grid {
    display: block;
  }

  .left-col,
  .right-col {
    width: 100%;
  }

  h2 {
    font-size: 18px;
    margin-top: 10px;
    margin-bottom: 10px;
  }

  .muted {
    font-size: 13px;
  }

  #searchInput {
    width: 100% !important;
    font-size: 16px;
    min-height: 42px;
  }

  .search-row {
    display: block;
  }

  .search-row label {
    display: block;
    margin-bottom: 6px;
  }

  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-left: -2px;
    margin-right: -2px;
    padding-bottom: 4px;
  }

  .table-scroll::-webkit-scrollbar {
    height: 8px;
  }

  .table-scroll::-webkit-scrollbar-thumb {
    background: #bbb;
    border-radius: 999px;
  }

  .table-scroll table {
    min-width: 1400px;
  }

  th,
  td {
    font-size: 12px;
    padding: 7px 6px;
    white-space: nowrap;
  }

  button {
    min-height: 40px;
    padding-left: 10px;
    padding-right: 10px;
  }
}

      padding: 12px 10px;
      border-radius: 10px;
    }

    .advisor-grid {
      display: block;
    }

    .left-col,
    .right-col {
      width: 100%;
    }

    h2 {
      font-size: 18px;

    }

    .muted {

    }

    }

    }

    }

    .table-scroll table {
      min-width: 1400px;
    }

    th,
    td {
      font-size: 12px;
      padding: 7px 6px;

    }

    button {
      min-height: 40px;
      padding-left: 10px;
      padding-right: 10px;
    }
  </style>
</head>

<body>

  <div id="nav"></div>

  <div id="manualControls" class="card" style="margin-bottom:16px; display:none;">
    <b>Wash Day Control:</b>
    <button id="openWashBtn">OPEN</button>
    <button id="closeWashBtn">CLOSE</button>
    <span id="settingsMsg" class="muted" style="margin-left:10px;"></span>
  </div>

  <p id="status" class="muted" style="margin:6px 0 10px 0;"></p>

  <h2 style="margin-bottom:6px;">Advisor</h2>

  <div class="card">

    <div class="advisor-grid">

      <div class="left-col">

        <div id="msg" class="muted" style="margin-top:10px;"></div>

        <div class="search-row" style="margin-top:10px;">
          <label for="searchInput" class="muted">Search:</label>
          <input id="searchInput" type="text" placeholder="Tag or RO..." />
        </div>

        <div class="table-scroll" style="margin-top:10px;">
          <table id="ticketsTable"></table>
        </div>

      </div>

    </div>

  </div>

  <script type="module">

    import { requireRole, getUserProfile } from "./js/guard.js";
    import { renderNav } from "./js/nav.js";
    import { mountTicketsUI } from "./js/ticketsUI.js";
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { listenSystemSettings, setSystemSettings } from "./js/settings.js";

    const navHTML = renderNav("ROLE");

    // remove Advisor tab ONLY on this page
    const cleanedNav = navHTML.replace(/>Advisor</g, '>Dashboard<');

    document.getElementById("nav").innerHTML = cleanedNav;

    requireRole(["advisor", "manager", "admin", "booker", "qc"]);

    const openBtn = document.getElementById("openWashBtn");
    const closeBtn = document.getElementById("closeWashBtn");
    const msg = document.getElementById("settingsMsg");
    const panel = document.getElementById("manualControls");

    function setMsg(text, ok = true) {
      msg.textContent = text;
      msg.style.color = ok ? "green" : "crimson";
    }

    onAuthStateChanged(auth, async (user) => {

      if (!user) return;

      const profile = await getUserProfile(user);
      const role = String(profile?.role || "").toLowerCase();
      const statusEl = document.getElementById("status");
      statusEl.textContent = `${user.email} · ${role}`;

      const canControl =
        role === "admin" ||
        role === "manager" ||
        profile?.permissions?.canControlWashDay === true;

      panel.style.display = canControl ? "block" : "none";

      if (canControl) {

        openBtn.onclick = async () => {
          await setSystemSettings(user, { isOpen: true });
          setMsg("Wash OPEN");
        };

        closeBtn.onclick = async () => {
          await setSystemSettings(user, { isOpen: false });
          setMsg("Wash CLOSED");
        };

      }

      const realRole = role;

      mountTicketsUI({
        role: realRole,
        tableEl: document.getElementById("ticketsTable"),
        msgEl: document.getElementById("msg"),
        showTabs: true,
        searchEl: document.getElementById("searchInput"),
        viewColumnKeys: profile?.viewColumns?.[realRole] || [],
        canEditTickets: profile?.permissions?.canEditTickets === true,
        correctionsPerms: profile?.permissions?.corrections || {}
      });

    });

  </script>

</body>

</html>
