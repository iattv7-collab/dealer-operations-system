<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor</title>



  <style>
    :root {
      --blue: #0b3d91;
      --teal: #00a8c6;
      --bg: #f4f6f8;
      --card: #ffffff;
      --grid: #c9c9c9;
      --text: #1f2937;
      --muted: #6b7280;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Times New Roman", Times, serif;
      background:
        linear-gradient(135deg, rgba(11, 61, 145, 0.08), rgba(0, 168, 198, 0.08)),
        var(--bg);
      color: var(--text);
    }

    body {
      max-width: 100%;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      font-size: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--grid);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
      background: #fff;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      text-align: left;
      background: #f7fafc;
    }

    .muted {
      color: var(--muted);
    }

    .ok {
      color: #0a6;
    }

    .err {
      color: var(--danger);
    }

    .advisor-grid {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .left-col {
      flex: 1 1 auto;
      min-width: 0;
    }

    .right-col {
      flex: 0 0 260px;
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .table-scroll table {
      width: max-content;
      min-width: 100%;
    }

    #nav {
      background: var(--blue);
      color: #fff;
      padding: 14px 18px 10px;
      border-bottom: 4px solid var(--teal);
      margin-bottom: 16px;
    }

    #nav>div {
      display: flex;
      gap: 10px;
      margin-bottom: 0;
      flex-wrap: wrap;
    }

    #nav a {
      text-decoration: none;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      display: inline-block;
    }

    #nav a.active {
      background: #ffffff;
      color: var(--blue);
      border: 2px solid var(--teal);
      font-weight: bold;
    }

    #nav a:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    #searchInput {
      padding: 8px 10px !important;
      width: 240px !important;
      max-width: 100%;
      box-sizing: border-box;
      border: 1px solid #b9c1cc;
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 16px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    h2 {
      color: var(--blue);
      margin-top: 0;
    }

    #manualControls {
      background: #fff;
      border: 1px solid var(--grid);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
    }

    #status {
      margin: 6px 16px 10px 16px !important;
    }

    body>h2,
    body>.card,
    body>p:not(#status),
    body>div:not(#nav):not(#manualControls) {
      margin-left: 16px;
      margin-right: 16px;
    }

    @media (max-width: 768px) {
      body {
        margin: 0;
      }

      #nav {
        padding: 14px 12px 10px;
      }

      #nav>div {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      #nav a {
        flex: 0 1 auto;
        text-align: center;
        padding: 8px 10px;
        font-size: 14px;
        box-sizing: border-box;
      }

      .card {
        padding: 12px 10px;
        border-radius: 10px;
      }

      .advisor-grid {
        display: block;
      }

      .left-col,
      .right-col {
        width: 100%;
      }

      h2 {
        font-size: 20px;
        margin-top: 10px;
        margin-bottom: 10px;
      }

      .muted {
        font-size: 13px;
      }

      #searchInput {
        width: 100% !important;
        font-size: 16px;
        min-height: 42px;
      }

      .search-row {
        display: block;
      }

      .search-row label {
        display: block;
        margin-bottom: 6px;
      }

      .table-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        margin-left: -2px;
        margin-right: -2px;
        padding-bottom: 4px;
      }

      .table-scroll::-webkit-scrollbar {
        height: 8px;
      }

      .table-scroll::-webkit-scrollbar-thumb {
        background: #bbb;
        border-radius: 999px;
      }

      .table-scroll table {
        min-width: 1400px;
      }

      th,
      td {
        font-size: 12px;
        padding: 7px 6px;
        white-space: nowrap;
      }

      button {
        min-height: 40px;
        padding-left: 10px;
        padding-right: 10px;
      }

      body>h2,
      body>.card,
      body>p:not(#status),
      body>div:not(#nav):not(#manualControls) {
        margin-left: 12px;
        margin-right: 12px;
      }

      #status {
        margin: 6px 12px 10px 12px !important;
      }
    }
  </style>



<body>

  <div id="nav"></div>

  <div id="manualControls" class="card" style="margin-bottom:16px; display:none;">
    <b>Wash Day Control:</b>
    <button id="openWashBtn">OPEN</button>
    <button id="closeWashBtn">CLOSE</button>
    <span id="settingsMsg" class="muted" style="margin-left:10px;"></span>
  </div>

  <p id="status" class="muted" style="margin:6px 0 10px 0;"></p>

  <h2 style="margin-bottom:6px;">Advisor</h2>

  <div class="card">

    <div class="advisor-grid">

      <div class="left-col">

        <div id="msg" class="muted" style="margin-top:10px;"></div>

        <div class="search-row" style="margin-top:10px;">
          <label for="searchInput" class="muted">Search:</label>
          <input id="searchInput" type="text" placeholder="Tag or RO..." />
        </div>

        <div class="table-scroll" style="margin-top:10px;">
          <table id="ticketsTable"></table>
        </div>

      </div>

    </div>

  </div>

  <script type="module">

    import { requireRole, getUserProfile } from "./js/guard.js";
    import { renderNav } from "./js/nav.js";
    import { mountTicketsUI } from "./js/ticketsUI.js";
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { listenSystemSettings, setSystemSettings } from "./js/settings.js";

    const navHTML = renderNav("ROLE");

    // remove Advisor tab ONLY on this page
    const cleanedNav = navHTML.replace(/>Advisor</g, '>Dashboard<');

    document.getElementById("nav").innerHTML = cleanedNav;

    requireRole(["advisor", "manager", "admin", "booker", "qc"]);

    const openBtn = document.getElementById("openWashBtn");
    const closeBtn = document.getElementById("closeWashBtn");
    const msg = document.getElementById("settingsMsg");
    const panel = document.getElementById("manualControls");

    function setMsg(text, ok = true) {
      msg.textContent = text;
      msg.style.color = ok ? "green" : "crimson";
    }

    onAuthStateChanged(auth, async (user) => {

      if (!user) return;

      const profile = await getUserProfile(user);
      const role = String(profile?.role || "").toLowerCase();
      const statusEl = document.getElementById("status");
      statusEl.textContent = `${user.email} · ${role}`;

      const canControl =
        role === "admin" ||
        role === "manager" ||
        profile?.permissions?.canControlWashDay === true;

      panel.style.display = canControl ? "block" : "none";

      if (canControl) {

        openBtn.onclick = async () => {
          await setSystemSettings(user, { isOpen: true });
          setMsg("Wash OPEN");
        };

        closeBtn.onclick = async () => {
          await setSystemSettings(user, { isOpen: false });
          setMsg("Wash CLOSED");
        };

      }

      const realRole = role;

      mountTicketsUI({
        role: realRole,
        tableEl: document.getElementById("ticketsTable"),
        msgEl: document.getElementById("msg"),
        showTabs: true,
        searchEl: document.getElementById("searchInput"),
        viewColumnKeys: profile?.viewColumns?.[realRole] || [],
        canEditTickets: profile?.permissions?.canEditTickets === true,
        correctionsPerms: profile?.permissions?.corrections || {}
      }
      );

      const path = window.location.pathname.split("/").pop();

      document.querySelectorAll("#nav a").forEach(link => {
        const href = link.getAttribute("href");
        if (href && path === href.split("/").pop()) {
          link.classList.add("active");
        }

      });

    });

  </script>

</body>

</html>
