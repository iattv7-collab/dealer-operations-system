<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RO Tracker</title>

  <!-- reduce phone caching -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- CACHE-BUST VERSION -->
  <link rel="stylesheet" href="./styles.css?v=20260324-1" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b3d91">
</head>

<body>
  <header style="display:flex; justify-content:space-between; align-items:center;">

    <!-- LEFT -->
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="btnBack">Back</button>
      <div style="font-weight:bold;">RO Tracker</div>
    </div>

    <!-- RIGHT -->
    <div style="display:flex; align-items:center; gap:12px;">

      <div id="signedInInfo" style="font-size:14px; opacity:0.9;"></div>

      <div id="trackerTabs" style="display:flex; gap:6px;"></div>

      <button id="btnLogout">Logout</button>

    </div>

  </header>

  <div class="toolbar">
    <button class="btn" id="btnFollowUp">Follow Up</button>
    <button class="btn" id="btnSettings">Settings</button>
    <button class="btn" id="btnArchiveView">Archive / Follow Up</button>
    <button class="btn" id="btnNotify">Enable Notifications</button>
    <button class="btn" id="btnToggleView">Short View</button>

    <input id="searchActive" type="text" placeholder="Search RO, Tag, Name, Phone"
      style="margin-left:10px;padding:6px 10px;width:260px;font-family:'Times New Roman';" />
  </div>


  <div class="tablewrap">
    <table>
      <colgroup>
        <col class="col-ro">
        <col class="col-tag">
        <col class="col-customer">
        <col class="col-phone">
        <col class="col-date">
        <col class="col-date">
        <col class="col-model">
        <col class="col-concern">
        <col class="col-ready">
        <col class="col-notes">
        <col class="col-video">
        <col class="col-called">
        <col class="col-next">
        <col class="col-wait">
        <col class="col-loaner">
        <col class="col-archive">
      </colgroup>
      <thead>
        <tr>
          <th class="col-ro">RO #</th>
          <th class="col-tag">Tag #</th>
          <th class="col-customer">Customer name</th>
          <th class="col-phone">Phone</th>
          <th class="col-date">RO Date</th>
          <th class="col-date">Promise Date</th>
          <th class="col-model">Model</th>
          <th class="col-concern">Concern</th>
          <th class="col-ready">Ready Called</th>
          <th class="col-notes">Notes</th>
          <th class="col-video">Tech Video</th>
          <th class="col-called">Called</th>
          <th class="col-next">Next Update</th>
          <th class="col-wait">Waiter</th>
          <th class="col-loaner">Loaner</th>
          <th class="col-archive">Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Barcode reader (ZXing) -->
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <script type="module">
    import { auth } from "../js/firebase.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    // BACK
    document.getElementById("btnBack").addEventListener("click", () => {
      window.location.href = "/index.html";
    });

    // LOGOUT
    document.getElementById("btnLogout").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "/login.html";
    });
  </script>

  <!-- CACHE-BUST VERSION -->
  <script type="module" src="./auth-gate.js"></script>
</body>

</html>
