<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications</title>

  <link rel="stylesheet" href="./styles.css" />

</head>

<body style="font-family:'Times New Roman'; padding:20px;">

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2>Notifications</h2>
    <button id="btnBack" class="smallbtn">Back</button>
  </div>

  <div id="notificationCenter"></div>

  <script type="module">
    import { auth } from "../js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { initNotificationCenter } from "./modules/notification-center.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "/login.html";
        return;
      }

      initNotificationCenter({
        userId: user.uid,
        mountId: "notificationCenter"
      });
    });

    document.getElementById("btnBack").onclick = () => {
      window.location.href = "/ro/";
    };
  </script>

</body>
</html>
