<!-- FILE: /public/settings.html -->

<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>DOS Settings</title>

  <link rel="stylesheet" href="/css/arrowflow.css">
</head>

<body>

  <div id="nav"></div>

  <h2>Dealer Operations System — Settings</h2>
  <div id="saveState" class="pill" style="margin:10px 0;">Loaded</div>

  <div class="card" style="max-width:720px;">
    <div style="font-weight:bold; margin-bottom:8px;">Current (saved)</div>
    <div id="currentSettingsText" class="muted" style="white-space:pre-wrap;"></div>
  </div>

  <hr style="margin: 20px 0;" />

  <h3>Features</h3>

  <label style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
    <input type="checkbox" id="pickupEnabledToggle" />
    Enable Pickup Workflow
  </label>

  <div id="settingsMsg" class="muted" style="margin-top:10px;"></div>

  <hr style="margin: 24px 0;" />

  <h3>Wash Configuration</h3>

  <div class="grid">

    <div class="row">
      <label for="washDurationMin">Wash Duration (minutes)</label>
      <div>
        <input type="number" id="washDurationMin" min="1" max="120" style="width:120px;" />
        <div class="hint">Base wash time.</div>
      </div>
    </div>

    <div class="row">
      <label for="bufferMin">Buffer (minutes)</label>
      <div>
        <input type="number" id="bufferMin" min="0" max="60" style="width:120px;" />
        <div class="hint">Extra time per car.</div>
      </div>
    </div>

    <div class="row">
      <label for="openBays">Bays Override</label>
      <div>
        <input type="number" id="openBays" min="0" max="50" style="width:120px;" />
      </div>
    </div>

    <div class="row">
      <label>Effective Bays</label>
      <div>
        <span id="effectiveBays" class="pill"></span>
      </div>
    </div>

  </div>

  <hr style="margin: 24px 0;" />

  <h3>Operating Schedule</h3>

  <div class="grid">

    <div class="row">
      <label for="autoStart">Auto-start</label>
      <div>
        <input type="checkbox" id="autoStart" />
      </div>
    </div>

    <div class="card">
      <div style="font-weight:bold; margin-bottom:8px;">Manual Mode</div>

      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button id="openWashBtn">Open Wash Day</button>
        <button id="closeWashBtn">Close Wash Day</button>
        <span>Current: <span id="isOpenBadge" class="pill"></span></span>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:bold; margin-bottom:10px;">Bays by Day</div>

      <div class="row">
        <label>Mon–Fri</label>
        <input type="number" id="mfBays" />
      </div>

      <div class="row">
        <label>Saturday</label>
        <input type="number" id="satBays" />
      </div>

      <div class="row">
        <label>Sunday</label>
        <input type="number" id="sunBays" />
      </div>
    </div>

    <div class="card">
      <div style="font-weight:bold; margin-bottom:10px;">Hours</div>

      <div class="row">
        <label>Mon–Fri</label>
        <div>
          <input id="mfOpen" placeholder="07:30" />
          to
          <input id="mfClose" placeholder="19:00" />
        </div>
      </div>

      <div class="row">
        <label>Saturday</label>
        <div>
          <input id="satOpen" />
          to
          <input id="satClose" />
        </div>
      </div>

      <div class="row">
        <label>Sunday</label>
        <div>
          <input id="sunOpen" />
          to
          <input id="sunClose" />
        </div>
      </div>
    </div>

    <div>
      <button id="saveSystemSettingsBtn">Save</button>
      <span id="systemSettingsMsg" class="muted"></span>
    </div>

    <div class="card" style="margin-top:20px;">
      <h3 style="margin-top:0;">Location Catalog</h3>

      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:12px;">
        <div>
          <label class="muted">Location Name</label><br>
          <input id="locLabel" placeholder="Example: Main Store - Lot 1" style="width:260px;">
        </div>

        <div>
          <label class="muted">Area</label><br>
          <select id="locArea">
            <option value="main">Main Store</option>
            <option value="annex">Annex</option>
          </select>
        </div>

        <button id="addLocationBtn" type="button">Add Location</button>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Location</th>
              <th>Area</th>
              <th>Active</th>
            </tr>
          </thead>
          <tbody id="locationCatalogBody">
            <tr>
              <td colspan="3" class="muted">No locations yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- FORCE LOGIN -->
  <script type="module">
    import { auth } from "./js/firebase.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const url = new URL(window.location.href);
    const reauth = url.searchParams.get("reauth");

    if (!reauth) {
      await signOut(auth);
      window.location.href = "/login.html?next=" + encodeURIComponent("/settings.html?reauth=1");
    }
  </script>

  <!-- NAV -->
  <script type="module">
    import { requireRole } from "./js/guard.js";
    import { renderNav } from "./js/nav.js";

    document.getElementById("nav").innerHTML = `
      <div>
        <a href="/home.html">Home</a>
      </div>
    ` + renderNav("settings");

    requireRole(["admin", "manager", "wash", "staff", "advisor", "booker", "qc", "dropoff"]);

    // active tab
    const path = window.location.pathname.split("/").pop();
    document.querySelectorAll("#nav a").forEach(link => {
      const href = link.getAttribute("href");
      if (href && path === href.split("/").pop()) {
        link.classList.add("active");
      }
    });
  </script>

  <!-- LOGIC -->
  <script type="module" src="./js/settingsPage.js?v=1"></script>

</body>

</html>
