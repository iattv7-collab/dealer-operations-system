<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Location Settings</title>
    <link rel="stylesheet" href="/css/arrowflow.css">
</head>

<body>

    <div id="nav"></div>

    <h2>Location Settings</h2>

    <!-- ACTIVE LOCATIONS -->
    <div class="card">

        <h3>Add Location</h3>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
            <input id="locLabel" placeholder="Location name (ex: Lot 1)" style="width:260px;">

            <select id="locArea">
                <option value="main">Main Store</option>
                <option value="annex">Annex</option>
            </select>

            <button id="addLocationBtn">Add Location</button>

            <button id="saveAllBtn" disabled style="opacity:0.4; background:#0b3d91; color:#fff; font-weight:600;">
                Save All Changes
            </button>
        </div>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Location</th>
                        <th>Area</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="activeLocationCatalogBody"></tbody>
            </table>
        </div>

    </div>

    <!-- INACTIVE LOCATIONS -->
    <div class="card" style="margin-top:16px;">

        <h3>Inactive Locations</h3>

        <div class="muted" style="margin-bottom:10px;">
            These are hidden from Move / Locate.
        </div>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Location</th>
                        <th>Area</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inactiveLocationCatalogBody"></tbody>
            </table>
        </div>

    </div>

    <script type="module">
        import { renderNav } from "./js/nav.js";
        document.getElementById("nav").innerHTML = renderNav("locationsettings");
    </script>

    <script type="module" src="/js/locationSettings.js?v=7"></script>

</body>

</html>
