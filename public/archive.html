<!-- FILE: /public/archive.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Archive</title>
  <link rel="stylesheet" href="/css/arrowflow.css">
</head>

<body>

  <div id="nav"></div>

  <div class="page">
    <h1>Master Archive</h1>
    <div id="status" class="muted">Loading...</div>

    <div class="card">
      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="Search RO, tag, customer, phone..." />

        <select id="sourceFilter">
          <option value="">All Sources</option>
          <option value="advisor">Advisor</option>
          <option value="wash">Wash</option>
          <option value="booker">Booker</option>
          <option value="admin">Admin</option>
          <option value="manager">Manager</option>
        </select>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>RO</th>
              <th>Tag</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Model</th>
              <th>Concern</th>
              <th>Location</th>
              <th>Archived From</th>
              <th>Archived By Role</th>
              <th>Archived At</th>
              <th>Need By</th>
              <th>Washed</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="archiveBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="/js/archiveList.js"></script>

</body>

</html>
