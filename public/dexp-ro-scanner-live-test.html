<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DEXP RO Scanner (Live Test)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f0f2f5;
      color: #1a1a1a;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 480px;
      margin: 0 auto 16px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    .file-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #0a4d8c;
      color: white;
      text-align: center;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .file-btn input { display: none; }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #444;
    }
    .field input, .field textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .field-error { border-color: #c00 !important; background: #fff5f5; }
    #status {
      font-weight: 600;
      margin: 8px 0;
      min-height: 1.2em;
    }
    #previewWrap { margin-top: 12px; text-align: center; }
    #preview { max-width: 100%; border-radius: 8px; display: none; }
    details { margin-top: 16px; }
    pre {
      background: #f6f6f6;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 240px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>DEXP RO Scanner — Live Test</h1>
    <p style="font-size:14px; color:#555; margin-top:0;">
      Uses the <strong>exact current DEXP extraction logic</strong> (crop + extractTagNumber / extractRONumber / extractAdvisorNumber / etc.).
    </p>

    <label class="file-btn">
      Scan / Upload RO Photo
      <input id="fileInput" type="file" accept="image/*" capture="environment" />
    </label>

    <div id="status">Ready</div>

    <div class="field">
      <label>RO Number</label>
      <input id="roNumber" readonly />
    </div>
    <div class="field">
      <label>Tag Number</label>
      <input id="tagNumber" readonly />
    </div>
    <div class="field">
      <label>Advisor Number</label>
      <input id="advisorNumber" readonly />
    </div>
    <div class="field">
      <label>Advisor Name</label>
      <input id="advisorName" readonly />
    </div>
    <div class="field">
      <label>Customer Name</label>
      <input id="customerName" readonly />
    </div>
    <div class="field">
      <label>Customer Phone</label>
      <input id="customerPhone" readonly />
    </div>
    <div class="field">
      <label>VIN</label>
      <input id="vin" readonly />
    </div>

    <div id="previewWrap">
      <img id="preview" alt="Cropped preview" />
    </div>

    <details>
      <summary>Raw OCR Text</summary>
      <pre id="rawText"></pre>
    </details>
  </div>

  <script>
    // ============================================================
    // Exact DEXP extraction functions (from ro-ocr-service.js)
    // ============================================================

    function getCleanLines(text) {
      return String(text || "")
        .split(/\n/)
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function extractRONumber(text) {
      const labeledMatch = String(text).match(
        /R\.?\s*O\.?\s*NO\.?\s*[:\-]?\s*(\d{5,7})/i
      );
      if (labeledMatch) return labeledMatch[1];

      const lines = getCleanLines(text);
      const labelIndex = lines.findIndex((line) =>
        /R\.?\s*O\.?\s*NO/i.test(line)
      );
      if (labelIndex >= 0) {
        for (let i = labelIndex; i < Math.min(lines.length, labelIndex + 4); i += 1) {
          const lineMatch = lines[i].match(/\b(\d{5,7})\b/);
          if (lineMatch) return lineMatch[1];
        }
      }
      return "";
    }

    function extractTagNumber(text) {
      const source = String(text || "");
      const cutoff = source.search(/I hereby authorize/i);
      const region = cutoff >= 0 ? source.slice(0, cutoff) : source;

      const tagIndex = region.search(/TAG\s*\.?\s*NO/i);
      if (tagIndex < 0) return "";

      const afterTag = region
        .slice(tagIndex)
        .replace(/\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b/g, " ");

      const fourDigit = afterTag.match(/\b\d{4}\b/g) || [];
      if (fourDigit.length) return fourDigit[fourDigit.length - 1];

      const other = afterTag.match(/\b\d{3,5}\b/g) || [];
      if (other.length) return other[other.length - 1];

      return "";
    }

    function extractAdvisorNumber(text) {
      const source = String(text || "");
      const cutoff = source.search(/I hereby authorize/i);
      const region = cutoff >= 0 ? source.slice(0, cutoff) : source;

      const blocks = [...region.matchAll(/ADVISOR\s*NO\.?([\s\S]{0,100})/gi)];
      if (!blocks.length) return "";

      const lastBlock = blocks[blocks.length - 1][1].replace(
        /\b\d{1,3},\d{3}\b/g, " "
      );
      const numbers = lastBlock.match(/\b\d{2,4}\b/g) || [];
      const threeDigit = numbers.filter((value) => value.length === 3);
      if (threeDigit.length) return threeDigit[0];
      return numbers[0] || "";
    }

    function extractAdvisorName(text) {
      const source = String(text || "");
      const cutoff = source.search(/I hereby authorize/i);
      const region = cutoff >= 0 ? source.slice(0, cutoff) : source;

      const advisorBlocks = [...region.matchAll(/ADVISOR(?!\s*NO)([\s\S]{0,120})/gi)];
      if (!advisorBlocks.length) return "";

      const lastBlock = advisorBlocks[advisorBlocks.length - 1][1];
      const nameMatch = lastBlock.match(/[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+/);
      return nameMatch ? nameMatch[0].trim() : "";
    }

    function extractCustomerName(text) {
      const lines = getCleanLines(text);
      const vinIndex = lines.findIndex((line) => /\b[A-Z0-9]{17}\b/i.test(line));
      if (vinIndex < 0) return "";

      const skipLine = /^(CUSTOMER\s*NO|YEAR\s*\/\s*MAKE|SERVICE\s*CONTRACT|SAVE\s*PARTS|PRODUCTION\s*DATE|DELIVERY\s*DATE|DELIVERY\s*MILES|STOCK\s*NO|LICENSE\s*NO|SELLING\s*DEALER|CONTRACT\s*NO|COLOR|TERMS|CASH|CREDIT\s*CD|CHECK|STATE\s*REG|VEHICLE|SALESPERSON|SERVICE|HOUSE\s*DEAL|OPERATION|DRIVEABILITY|SHUTTLE|MULTIPOINT|QUALITY\s*CONTROL|CAMPAIGN|WASHCAR|PRE\s*PAID)$/i;

      for (let i = vinIndex + 1; i < Math.min(lines.length, vinIndex + 12); i += 1) {
        let line = lines[i]
          .replace(/CUSTOMER\s*NO\.?/gi, "")
          .replace(/\bYES\b/gi, "")
          .replace(/\bNO\b/gi, "")
          .replace(/[^A-Z0-9\s\-\&]/gi, "")
          .replace(/\s+/g, " ")
          .trim();

        if (!line || skipLine.test(line)) continue;
        if (/CONCERN|TRANSPORT|INSPECT|DESCRIPTION/i.test(line)) continue;
        if (/^\d+$/.test(line)) continue;
        if (/^(SUITE|STE)\b/i.test(line)) continue;
        if (/^\d+\s/.test(line)) continue;
        if (/@/.test(lines[i])) continue;

        const words = line.split(" ").filter(Boolean);
        if (words.length >= 2) return line;
      }
      return "";
    }

    function extractPhone(text) {
      const source = String(text || "");
      const residenceMatch = source.match(
        /RESIDENCE\s*PHONE([\s\S]{0,120}?)(\d{3}[-.\s]\d{3}[-.\s]\d{4})/i
      );
      if (residenceMatch) return residenceMatch[2];
      const phones = source.match(/\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b/g) || [];
      return phones[0] || "";
    }

    function extractVIN(text = "") {
      const lines = String(text).toUpperCase().split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const VIN_PATTERN = /^[A-HJ-NPR-Z0-9]{17}$/;
      const transliteration = { A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9 };
      const weights = [8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];

      function repairCandidate(value = "") {
        const candidate = String(value).toUpperCase().replace(/[^A-Z0-9]/g, "");
        if (candidate.length !== 17) return "";
        const repaired = candidate.replace(/O/g, "0").replace(/I/g, "1").replace(/Q/g, "0");
        return VIN_PATTERN.test(repaired) ? repaired : "";
      }

      function passesChecksum(vin = "") {
        if (!VIN_PATTERN.test(vin)) return false;
        let total = 0;
        for (let i = 0; i < vin.length; i++) {
          const c = vin[i];
          const v = /\d/.test(c) ? Number(c) : transliteration[c];
          if (v === undefined) return false;
          total += v * weights[i];
        }
        const rem = total % 11;
        const expected = rem === 10 ? "X" : String(rem);
        return vin[8] === expected;
      }

      function getCandidatesFromLine(line = "") {
        const matches = line.match(/(?:^|[^A-Z0-9])([A-Z0-9]{17})(?=$|[^A-Z0-9])/g) || [];
        return matches.map(m => repairCandidate(m)).filter(Boolean);
      }

      const vehicleIdIndex = lines.findIndex(line => /VEHICLE\s+(?:I\.?\s*D\.?|L\.?\s*D\.?)\s*NO/i.test(line));
      const prioritized = [];
      if (vehicleIdIndex >= 0) {
        for (let i = vehicleIdIndex + 1; i < Math.min(lines.length, vehicleIdIndex + 5); i++) {
          prioritized.push(lines[i]);
        }
      }

      const all = [];
      for (const line of [...prioritized, ...lines]) {
        for (const c of getCandidatesFromLine(line)) {
          if (!all.includes(c)) all.push(c);
        }
      }
      const checksum = all.find(c => passesChecksum(c));
      return checksum || all[0] || "";
    }

    // ============================================================
    // DEXP-style crop (same region as current DEXP)
    // ============================================================
    async function cropImageToIntakeBlock(file) {
      const image = await loadImage(file);
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const crop = { x: 0.02, y: 0.28, width: 0.96, height: 0.36 };
      const sourceX = image.width * crop.x;
      const sourceY = image.height * crop.y;
      const sourceWidth = image.width * crop.width;
      const sourceHeight = image.height * crop.height;

      canvas.width = sourceWidth;
      canvas.height = sourceHeight;
      ctx.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, sourceWidth, sourceHeight);

      return canvas.toDataURL("image/jpeg", 0.92);
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    // ============================================================
    // UI + OCR
    // ============================================================
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");

    function setField(id, value) {
      document.getElementById(id).value = value || "";
    }

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      statusEl.textContent = "Cropping intake block…";
      try {
        const dataUrl = await cropImageToIntakeBlock(file);
        preview.src = dataUrl;
        preview.style.display = "block";

        const base64 = dataUrl.split(",")[1] || "";

        statusEl.textContent = "Sending to DEXP OCR function…";
        const response = await fetch("https://scanro-kaxooupkzq-uc.a.run.app", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64 })
        });

        if (!response.ok) {
          throw new Error("DEXP OCR request failed (" + response.status + ")");
        }

        const result = await response.json();
        const text = result.rawText || "";

        document.getElementById("rawText").textContent = text || "(empty)";

        setField("roNumber", extractRONumber(text));
        setField("tagNumber", extractTagNumber(text));
        setField("advisorNumber", extractAdvisorNumber(text));
        setField("advisorName", extractAdvisorName(text));
        setField("customerName", extractCustomerName(text));
        setField("customerPhone", extractPhone(text));
        setField("vin", extractVIN(text));

        statusEl.textContent = "Done — check the fields above.";
      } catch (err) {
        statusEl.textContent = "Error: " + (err.message || err);
        console.error(err);
      }
    });
  </script>
</body>
</html>
