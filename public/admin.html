<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>ArrowFlow – Admin</title>
  <link rel="stylesheet" href="/css/arrowflow.css">
  <style>
    /* --- Columns modal only --- */
    #columnsModalBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #columnsModal {
      background: #fff;
      width: min(760px, 92vw);
      max-height: 84vh;
      overflow: auto;
      border: 1px solid #ccc;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
    }

    #columnsModalHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    #columnsModalUserLine {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #columnsModalTopRow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    #columnsModalGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 18px;
      padding: 8px 0;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      margin-bottom: 12px;
    }

    #columnsModalActions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    #columnsModalMsg.ok {
      color: #0a7a2a;
      margin-top: 10px;
      font-weight: bold;
      font-size: 18px;
    }

    #columnsModalMsg.err {
      color: #b00020;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div id="nav"></div>

  <p id="status" class="muted">Loading...</p>

  <h2>Admin / User Management</h2>

  <div class="card">
    <h3 style="margin-top:0;">Pending approvals</h3>

    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Name</th>
          <th>Employee ID</th>
          <th>Dealer ID</th>
          <th>Set role</th>
          <th>Approve</th>
        </tr>
      </thead>
      <tbody id="pendingTable"></tbody>
    </table>
  </div>

  <div class="card" style="margin-top:16px;">
    <h3 style="margin-top:0;">All users</h3>

    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Name</th>
          <th>Employee ID</th>
          <th>Dealer ID</th>
          <th>Role</th>
          <th>Active (Account)</th>
          <th>Supervisor (Wash Day)</th>
          <th>Corrections Tab</th>
          <th>Fix Tag</th>
          <th>Fix RO</th>
          <th>Fix Location</th>
          <th>Fix Advisor #</th>
          <th>Actions (Admin)</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </div>

  <div id="columnsModalBackdrop" aria-hidden="true">
    <div id="columnsModal" role="dialog" aria-modal="true" aria-label="Configure Columns">
      <div id="columnsModalHeader">
        <h3 style="margin:0;">Configure Columns</h3>
        <button id="columnsModalCloseBtn" type="button">X</button>
      </div>

      <div id="columnsModalUserLine"></div>

      <div id="columnsModalTopRow">
        <label for="columnsModalViewSelect">View:</label>
        <select id="columnsModalViewSelect"></select>
      </div>

      <div id="columnsModalGrid"></div>

      <div id="columnsModalActions">
        <button id="columnsModalCancelBtn" type="button">Cancel</button>
        <button id="columnsModalSaveBtn" type="button">Save</button>
      </div>

      <div id="columnsModalMsg"></div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const url = new URL(window.location.href);
    const reauth = url.searchParams.get("reauth");

    if (!reauth) {
      await signOut(auth);
      window.location.href = "/login.html?next=" + encodeURIComponent("/admin.html?reauth=1");
    }
  </script>

  <script type="module">
    import { requireRole } from "./js/guard.js";
    import { renderNav } from "./js/nav.js";
    import "./js/admin.js";

    document.getElementById("nav").innerHTML = `
      <div>
        <a href="/home.html">Home</a>
      </div>
    ` + renderNav("admin");

    requireRole(["admin"]);

    const path = window.location.pathname.split("/").pop();

    document.querySelectorAll("#nav a").forEach(link => {
      const href = link.getAttribute("href");
      if (href && path === href.split("/").pop()) {
        link.classList.add("active");
      }
    });
  </script>

</body>

</html>
