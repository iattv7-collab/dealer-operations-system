<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin – Dealer Wash System</title>
  <style>
    body { font-family: "Times New Roman", Times, serif; margin: 16px; }
    button, select, input { font-family: inherit; font-size: 16px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; vertical-align: top; }
    th { text-align: left; }
  </style>
</head>

<body>

  <!-- Shared nav (same as manager/advisor/wash) -->
  <div id="nav"></div>

  <h2>Admin / User Management</h2>

  <div id="status">Loading...</div>

  <hr>

  <h3>Pending approvals</h3>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Name</th>
        <th>Employee ID</th>
        <th>Set role</th>
        <th>Approve</th>
      </tr>
    </thead>
    <tbody id="pendingTable"></tbody>
  </table>

  <hr>

  <h3>All users</h3>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Name</th>
        <th>Employee ID</th>
        <th>Role</th>
        <th>Active</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="usersTable"></tbody>
  </table>

  <script type="module">
    import { requireRole } from "./js/guard.js";
    import { renderNav } from "./js/nav.js";
    import "./js/admin.js";

    document.getElementById("nav").innerHTML = renderNav("admin");
    requireRole(["admin"]);
  </script>

</body>
</html>
