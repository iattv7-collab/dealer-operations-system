<!-- FILE: /public/register.html -->

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ArrowFlow – Register</title>
  <link rel="stylesheet" href="/css/arrowflow.css">
</head>
<body>

  <div class="page" style="max-width: 560px; margin: 40px auto;">
    <div class="card">
      <h2 style="margin-top:0;">ArrowFlow</h2>
      <h3>Create account</h3>

      <form id="regForm">
        <div style="margin-bottom:12px;">
          <input type="text" id="name" placeholder="Full name" required style="width:100%; padding:8px 10px;" />
        </div>

        <div style="margin-bottom:12px;">
          <input type="text" id="employeeId" placeholder="Employee ID" required style="width:100%; padding:8px 10px;" />
        </div>

        <div style="margin-bottom:12px;">
          <input type="email" id="email" placeholder="Email" required style="width:100%; padding:8px 10px;" />
        </div>

        <div style="margin-bottom:12px;">
          <input type="password" id="password" placeholder="Password" required style="width:100%; padding:8px 10px;" />
        </div>

        <button type="submit">Register</button>
      </form>

      <p id="msg" class="muted" style="margin-top:14px;"></p>
      <p style="margin-top:16px;"><a href="/login.html">Back to login</a></p>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase.js";
    import { createUserWithEmailAndPassword } from
      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from
      "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const form = document.getElementById("regForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      const name = document.getElementById("name").value.trim();
      const employeeId = document.getElementById("employeeId").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);

        await setDoc(doc(db, "users", cred.user.uid), {
          name,
          employeeId,
          email,
          role: "pending",
          active: true,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        msg.innerHTML =
          "<b>Account created.</b> Now sign in. (Admin approval required.)";

        form.reset();

      } catch (err) {
        msg.textContent = err.message;
      }
    });
  </script>

</body>
</html>
