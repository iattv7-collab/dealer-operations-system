<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Requests</title>
    <link rel="stylesheet" href="/css/arrowflow.css">

    <style>
        /* REQUEST PAGE ONLY */

        #msg {
            margin-top: 12px;
        }

        #msg:empty {
            display: none;
        }

        #vehicleBox {
            margin-top: 12px;
        }

        #vehicleBox hr {
            margin: 12px 0;
        }
    </style>
</head>

<body>

    <div id="nav"></div>

    <h2>Vehicle Requests</h2>
    <p id="status"></p>

    <div id="notifMount"></div>

    <div class="card">
        <h3 style="margin:0 0 4px 0;">Request Vehicle Move</h3>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
            <div class="muted">
                Search by RO, Tag, or VIN
            </div>
        </div>

        <div style="display:flex; gap:8px; align-items:center; margin-top:6px;">
            <input id="requestSearchInput" placeholder="Tag / RO / VIN" style="flex:1;" />

            <button id="requestSearchBtn" class="btn" type="button">
                Find
            </button>
        </div>

        <div id="msg" class="muted"></div>

        <div id="vehicleBox" style="display:none;">
            <div style="border:1px solid #ddd; border-radius:12px; padding:14px;">

                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">

                    <div style="flex:1;">
                        <div class="preview-tag">
                            TAG <span id="reqTag"></span>
                        </div>

                        <div class="preview-ro" style="margin-top:6px;">
                            RO <span id="reqRo"></span>
                        </div>

                        <div class="preview-line" style="margin-top:10px;">
                            Current Location: <span id="reqLocation"></span>
                        </div>
                    </div>

                    <button type="button" id="toggleDetailsBtn" class="btn small">
                        Details
                    </button>

                </div>

                <div id="vehicleDetails" style="display:none; margin-top:10px;">
                    <div><b>Customer:</b> <span id="reqCustomer"></span></div>
                    <div><b>VIN:</b> <span id="reqVin"></span></div>
                    <div><b>Description:</b> <span id="reqDescription"></span></div>
                </div>

                <hr>

                <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:end;">
                    <div>
                        <label class="muted">Request Type</label><br>
                        <select id="requestType" style="padding:6px 8px; min-width:180px;">
                            <option value="">Select...</option>
                            <option value="customerPickup">Customer Pickup</option>
                            <option value="bringToShop">Bring to Shop</option>
                            <option value="moveToAnnex">Move to Annex</option>
                            <option value="moveToMain">Move to Main Store</option>
                        </select>
                    </div>

                    <div>
                        <label class="muted">Destination Area</label><br>
                        <select id="toArea" style="padding:6px 8px; min-width:180px;">
                            <option value="">Select...</option>
                        </select>
                    </div>

                    <div>
                        <label class="muted">Destination Location</label><br>
                        <select id="toLocation" style="padding:6px 8px; min-width:220px;">
                            <option value="">Select area first...</option>
                        </select>
                    </div>

                    <div>
                        <label class="muted">Note</label><br>
                        <input id="requestNote" placeholder="Optional" style="padding:10px 12px; width:180px;" />
                    </div>

                    <div>
                        <button id="submitRequestBtn" class="btn" type="button">
                            Submit Request
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="card" style="margin-top:16px;">
        <h3 style="margin-top:0;">Open Requests</h3>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>RO</th>
                        <th>Tag</th>
                        <th>Type</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Status</th>
                        <th>Requested By</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="requestsBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { renderNav } from "./js/nav.js";
        document.getElementById("nav").innerHTML = renderNav("requests");
    </script>

    <script type="module" src="/js/requests.js?v=9"></script>

</body>

</html>
